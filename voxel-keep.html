    CELL.top[k] = type === 2 ? 0.6 : Math.max(1, Math.round(h));
    if (type === 2) WATERK.push(k);
    const castleZone = cx > 23.8 && cx < 32.2 && Math.abs(cz) < 4.2;
    CELL.occ[k] = (type !== 0 || castleZone) ? 1 : 0;

const mapGroup = new THREE.Group();

function disposeGroup(g) {
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material !== matVox && o.material !== matTerrain && o.material !== matCloud) o.material.dispose();
  });
  g.clear();
}

function buildTerrain() {
  const land = [], water = [];
  for (let k = 0; k < NC; k++) (CELL.type[k] === 2 ? water : land).push(k);
  const tm = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), matTerrain, land.length);
  const GRASS = [0x6cbf4f, 0x5fae4a, 0x7ac85a, 0x58a044], SAND = [0xd8b47a, 0xcfa86a, 0xe2c48c];
  for (let n = 0; n < land.length; n++) {
    const k = land[n], x = cX(k), z = cZ(k), h = CELL.top[k];
    _v.set(x, h / 2, z); _s.set(1, h, 1);
    _m4.compose(_v, ident, _s);
    tm.setMatrixAt(n, _m4);
    const hsh = ((k * 2654435761) >>> 0) % 997;
    let c;
    if (CELL.type[k] === 1) c = Math.abs(x - riverX(z)) <= 1.5 ? 0x8a5a2e : SAND[hsh % 3];
    else c = GRASS[hsh % 4];
    tm.setColorAt(n, _col.set(c));
  }
  tm.receiveShadow = true;
  mapGroup.add(tm);

  const wm = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshPhongMaterial({ color: 0x2f8fd8, specular: 0xa6e2ff, shininess: 90, flatShading: true }), water.length);
  for (let n = 0; n < water.length; n++) {
    const k = water[n];
    _v.set(cX(k), 0.3, cZ(k)); _s.set(1, 0.6, 1);
    _m4.compose(_v, ident, _s);
    wm.setMatrixAt(n, _m4);
  }
  wm.receiveShadow = true;
  mapGroup.add(wm);

  // bridge railings where the path crosses the river
  const rails = [];
  for (let k = 0; k < NC; k++) {
    if (CELL.type[k] !== 1 || Math.abs(cX(k) - riverX(cZ(k))) > 1.5) continue;
    const x = cX(k), z = cZ(k), y = CELL.top[k];
    rails.push([x, y + .35, z - .95, 1.0, .7, .12, 0x5a3a20], [x, y + .35, z + .95, 1.0, .7, .12, 0x5a3a20]);
  }
  if (rails.length) mapGroup.add(voxMesh(mergeBoxes(rails)));
}

function placeObj(geo, x, z, rotY) {
  const k = cIdx(x, z);
  const m = voxMesh(geo);
  m.position.set(x, k >= 0 ? CELL.top[k] : 1, z);
  m.rotation.y = rotY;
  if (k >= 0) CELL.occ[k] = 1;
  mapGroup.add(m);
  return m;
}

function placeCamp() {
  let k = -1;
  for (let t = 0; t < 800 && k < 0; t++) {
    const i = ri(2, 24), j = ri(2, H - 3), c = j * W + i;
    if (CELL.type[c] !== 0 || CELL.occ[c]) continue;
    if (CELL.dp[c] < 5.5 || Math.abs(cX(c) - riverX(cZ(c))) < 4) continue;
    k = c;
  }
  if (k < 0) k = cIdx(-24, -17);
  const cx = cX(k), cz = cZ(k);
  CAMP = { x: cx, z: cz };
  placeObj(houseGeo(), cx - 1.6, cz - 1.4, 0.3);
  placeObj(houseGeo(), cx + 1.4, cz - 2.0, -0.2);
  placeObj(tentGeo(), cx - 0.6, cz + 2.0, 0.5);
  placeObj(tentGeo(), cx + 2.8, cz + 1.7, -0.4);
  const fx = cx + 0.6, fz = cz + 0.4;
  placeObj(campfireGeo(), fx, fz, 0);
  const fk = cIdx(fx, fz);
  CAMPFIRE.set(fx, (fk >= 0 ? CELL.top[fk] : 1) + 0.5, fz);
  campLight.position.copy(CAMPFIRE).add(V3(0, 1.2, 0));
}

function placeNature() {
  const trees = [], rocks = [];
  for (let k = 0; k < NC; k++) {
    if (CELL.occ[k] || CELL.type[k] !== 0 || CELL.dp[k] < 3.4) continue;
    const x = cX(k), z = cZ(k);
    const forest = Math.sin(x * 0.19 + 1.3) * Math.cos(z * 0.27) > 0.25;
    if (rnd() < (forest ? 0.42 : 0.08)) { trees.push(k); CELL.occ[k] = 1; }
    else if (rnd() < 0.025) { rocks.push(k); CELL.occ[k] = 1; }
  }
  if (trees.length) {
    const im = new THREE.InstancedMesh(treeGeo(), matVox, trees.length);
    im.castShadow = true; im.receiveShadow = true;
    trees.forEach((k, n) => {
      _v.set(cX(k) + rr(-.3, .3), CELL.top[k], cZ(k) + rr(-.3, .3));
      _s.setScalar(rr(0.8, 1.25));
      _q.setFromAxisAngle(AXIS_Y, rr(0, TAU));
      _m4.compose(_v, _q, _s);
      im.setMatrixAt(n, _m4);
      im.setColorAt(n, _col.setRGB(rr(.8, 1.05), rr(.85, 1.1), rr(.8, 1)));
    });
    mapGroup.add(im);
  }
  if (rocks.length) {
    const im = new THREE.InstancedMesh(rockGeo(), matVox, rocks.length);
    im.castShadow = true; im.receiveShadow = true;
    rocks.forEach((k, n) => {
      _v.set(cX(k) + rr(-.3, .3), CELL.top[k], cZ(k) + rr(-.3, .3));
      _s.setScalar(rr(0.7, 1.3));
      _q.setFromAxisAngle(AXIS_Y, rr(0, TAU));
      _m4.compose(_v, _q, _s);
      im.setMatrixAt(n, _m4);
      im.setColorAt(n, _col.setRGB(rr(.85, 1.1), rr(.85, 1.1), rr(.85, 1.1)));

}

function placeCastle() {
  const g = new THREE.Group();

const PMAX = 2600;
const PMESH = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), PMAX);
PMESH.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
PMESH.frustumCulled = false;
const PS = [];
for (let i = 0; i < PMAX; i++) {
  PS.push({ life: 0, max: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s0: 0, s1: 0, c0: new THREE.Color(), c1: new THREE.Color(), g: 0, drag: 0, bounce: false, vis: false });
  PMESH.setColorAt(i, _col.set(0xffffff));
}
scene.add(PMESH);
let pPtr = 0, FF = false;   // FF = fast-forward (no visual effects)

function emit(x, y, z, vx, vy, vz, life, s0, s1, c0, c1, g = 0, drag = 0, bounce = false) {
  if (FF) return;
  let p = null;
  for (let n = 0; n < PMAX; n++) {
    const q = PS[pPtr]; pPtr = (pPtr + 1) % PMAX;
    if (q.life <= 0) { p = q; break; }
  }
  if (!p) { p = PS[pPtr]; pPtr = (pPtr + 1) % PMAX; }
  p.x = x; p.y = y; p.z = z; p.vx = vx; p.vy = vy; p.vz = vz;
  p.life = life; p.max = life; p.s0 = s0; p.s1 = s1;
  p.c0.set(c0); p.c1.set(c1);
  p.g = g; p.drag = drag; p.bounce = bounce;
}

function updateParticles(dt) {
  for (let i = 0; i < PMAX; i++) {
    const p = PS[i];
    if (p.life > 0) {
      p.life -= dt;
      if (p.life > 0) {
        const age = 1 - p.life / p.max;
        p.vy += p.g * dt;
        if (p.drag) { const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; p.vz *= f; }
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        const s = lerp(p.s0, p.s1, age);
        if (p.bounce) {
          const gy = groundY(p.x, p.z) + s * 0.5;
          if (p.y < gy) { p.y = gy; p.vy = -p.vy * 0.35; p.vx *= 0.55; p.vz *= 0.55; }
        }
        _v.set(p.x, p.y, p.z); _s.setScalar(Math.max(s, 0.001));
        _m4.compose(_v, ident, _s);
        PMESH.setMatrixAt(i, _m4);
        PMESH.setColorAt(i, _col.copy(p.c0).lerp(p.c1, age));
        p.vis = true;
        continue;
      }
    }
    if (p.vis) {
      _s.setScalar(0); _m4.compose(ZERO, ident, _s);
      PMESH.setMatrixAt(i, _m4);
      p.vis = false;
    }
  }
  PMESH.instanceMatrix.needsUpdate = true;
  PMESH.instanceColor.needsUpdate = true;
}

function burst(x, y, z, n, cols, spd, life, s0, s1, g = -10, drag = 0, bounce = false) {
  if (FF) return;
  for (let i = 0; i < n; i++) {
    const a = rr(0, TAU), b = rr(-0.3, 1), r = Math.sqrt(1 - b * b), sp = spd * rr(0.35, 1);
    emit(x, y, z, Math.cos(a) * r * sp, b * sp + 1.5, Math.sin(a) * r * sp, life * rr(0.6, 1.2), s0 * rr(0.8, 1.2), s1, pick(cols), pick(cols), g, drag, bounce);
  }
}
function smoke(x, y, z, s = 0.5) {
  emit(x + rr(-.25, .25), y, z + rr(-.25, .25), rr(-.3, .3), rr(0.8, 1.8), rr(-.3, .3), rr(1.6, 2.8), s * 0.8, s * 3, 0x5c5f68, 0xc4c9d3, 0.4, 0.5);
}
function sparks(x, y, z, col, n, spd) { burst(x, y, z, n, [col, 0xffffff], spd, 0.5, 0.16, 0.04, -12, 0.2, true); }
function fireBit(x, y, z) {
  emit(x + rr(-.2, .2), y, z + rr(-.2, .2), rr(-.5, .5), rr(1.5, 3), rr(-.5, .5), rr(.35, .6), .24, .05, 0xffd24a, 0xff4a1a, 1.0, 1.0);

const FX = [];
const RING_GEO = (() => { const g = new THREE.RingGeometry(0.7, 0.85, 28); g.rotateX(-Math.PI / 2); return g; })();
function ring(x, y, z, color, r1, life) {

function orb(x, y, z, color, r1, life) {

  m.position.set(x, y, z);
  scene.add(m);
  FX.push({ m, kind: 'orb', t: 0, life, r1 });
}
function bolt(a, b, color, life = 0.22) {
  if (FF) return;
  const N = 9, d = a.distanceTo(b), pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, j = (i === 0 || i === N) ? 0 : d * 0.07;
    pts.push(V3(lerp(a.x, b.x, t) + rr(-j, j), lerp(a.y, b.y, t) + rr(-j, j), lerp(a.z, b.z, t) + rr(-j, j)));
  }
  const m = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 1 }));
  scene.add(m);
  FX.push({ m, kind: 'bolt', t: 0, life });
}
function updateFx(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i];
    f.t += dt;
    const age = f.t / f.life;
    if (age >= 1) {
      scene.remove(f.m);
      if (f.kind === 'bolt') f.m.geometry.dispose();
      f.m.material.dispose();
      FX.splice(i, 1);
      continue;
    }
    if (f.kind === 'ring') { const s = lerp(0.4, f.r1, age); f.m.scale.set(s, 1, s); f.m.material.opacity = 0.9 * (1 - age); }
    else if (f.kind === 'orb') { f.m.scale.setScalar(lerp(0.2, f.r1, Math.sqrt(age))); f.m.material.opacity = 0.8 * (1 - age); }
    else f.m.material.opacity = 1 - age;
  }
}

const EDEF = {

const ICE_GEO = new THREE.BoxGeometry(1, 1, 1);
const ICE_MAT = new THREE.MeshPhongMaterial({ color: 0xaee9ff, emissive: 0x1d5a7a, transparent: true, opacity: 0.38, depthWrite: false, shininess: 100 });

function spawnEnemy(kind, hpMul) {
  const d = EDEF[kind];

  const body = new THREE.Mesh(enemyGeo(kind), mat);

  }

    kind, def: d, g, body, mat, wings, ice, bar: makeBar(), hp, maxHp: hp, air: d.air,
    d: 0, prog: 0, x: 0, y: 1, z: 0, hx: 1, hz: 0, t: rr(0, 6),
    slow: 0, slowF: 1, burn: 0, burnDps: 0, flash: 0, wf: false, dead: false, barFrac: -1,
    fp0: null, fp1: null, flen: 1,
  };
  if (d.air) {

    e.flen = e.fp0.distanceTo(e.fp1);
  }
  enemies.push(e);
  scene.add(g);
  return e;
}

const _tA = new THREE.Vector3(), _tB = new THREE.Vector3();
function moveEnemy(e, dt) {
  const sf = e.slow > 0 ? e.slowF : 1;
  if (e.air) {
    e.prog += e.def.spd * sf * dt / e.flen;
    if (e.prog >= 1) return reachCastle(e);
    _tA.copy(e.fp0).lerp(e.fp1, e.prog);
    e.x = _tA.x; e.z = _tA.z; e.y = _tA.y + Math.sin(e.t * 3) * 0.3;
    e.hx = e.fp1.x - e.fp0.x; e.hz = e.fp1.z - e.fp0.z;
  } else {
    e.d += e.def.spd * sf * dt;
    if (e.d >= PATH_LEN) return reachCastle(e);
    pathAt(e.d, _tA); pathAt(e.d + 0.6, _tB);
    e.x = _tA.x; e.z = _tA.z; e.y = 1;
    e.hx = _tB.x - _tA.x; e.hz = _tB.z - _tA.z;
    e.prog = e.d / PATH_LEN;
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt;
    if (e.slow > 0) { e.slow -= dt; if (e.slow <= 0) e.slowF = 1; }
    if (e.burn > 0) {
      e.burn -= dt;
      damageEnemy(e, e.burnDps * dt, false);
      if (e.dead) continue;
      if (rnd() < dt * 8) fireBit(e.x, e.y + 1, e.z);
    }
    if (e.flash > 0) e.flash = Math.max(0, e.flash - dt * 5);
    moveEnemy(e, dt);
    if (e.dead) continue;
    const def = e.def;
    e.g.position.set(e.x, e.y + (e.air ? 0 : Math.abs(Math.sin(e.t * def.bob)) * 0.14), e.z);
    e.g.rotation.y = Math.atan2(e.hx, e.hz);
    e.body.rotation.z = e.air ? 0 : Math.sin(e.t * def.bob) * 0.06;
    if (e.wings) { const f = Math.sin(e.t * 15) * 0.9; e.wings[0].rotation.z = f; e.wings[1].rotation.z = -f; }
    e.ice.visible = e.slow > 0;
    const f = e.flash * 0.85;
    if (f > 0 || e.wf) { e.mat.emissive.setRGB(f, f, f); e.wf = f > 0; }
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].dead) { releaseEnemy(enemies[i]); enemies.splice(i, 1); }
  }
}

function releaseEnemy(e) {
  scene.remove(e.g);
  scene.remove(e.bar);
  e.mat.dispose();
  e.bar.userData.fgm.dispose();
}

function damageEnemy(e, dmg, flash = true) {
  if (e.dead) return;
  e.hp -= dmg;
  if (flash) e.flash = 1;
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  kills++;
  gold += e.def.bounty;
  const sz = clamp(e.def.w * 0.2, 0.2, 0.6);
  const n = e.def.boss ? 110 : Math.round(16 + e.def.h * 6);
  burst(e.x, e.y + e.def.h * 0.5, e.z, n, e.def.col, 8, 1.1, sz, sz * 0.5, -20, 0.2, true);
  smoke(e.x, e.y + e.def.h * 0.6, e.z, 0.5 + sz);
  spawnCoins(e.x, e.y + e.def.h * 0.6, e.z, e.def.boss ? 14 : (e.def.bounty >= 8 ? 4 : 2));
  if (e.def.boss) {
    orb(e.x, e.y + 2, e.z, 0xffd24a, 9, 0.8);
    ring(e.x, 1.02, e.z, 0xffd24a, 12, 1.2);
    for (let i = 0; i < 8; i++) smoke(e.x + rr(-3, 3), e.y + rr(1, 4), e.z + rr(-3, 3), 1.2);
  }
}

function reachCastle(e) {
  if (e.dead) return;
  e.dead = true;
  castleHit(e.def.dmg);
  burst(e.x, 1.5, e.z, 8, e.def.col, 4, 0.7, 0.25, 0.1, -20, 0, true);
}

/* ================= towers ================= */
const TDEF = {
  arrow:  { name: 'Archer', cost: 45,  dmg: 9,  range: 7.6, rate: 0.9,  air: true,  topY: 3.8 },
  cannon: { name: 'Cannon', cost: 95,  dmg: 38, range: 8.6, rate: 0.45, air: false, topY: 2.3, splash: 2.0 },
  frost:  { name: 'Frost',  cost: 70,  dmg: 6,  range: 7.0, rate: 1.1,  air: true,  topY: 4.4, slowF: 0.4, slowT: 2.6 },
  storm:  { name: 'Storm',  cost: 125, dmg: 16, range: 8.2, rate: 0.75, air: true,  topY: 5.3, chain: 3 },
  flame:  { name: 'Flame',  cost: 80,  dmg: 24, range: 4.4, rate: 0,    air: false, topY: 3.5 },   // dmg = damage per second
};
const towers = [];
const buildCost = type => Math.round(TDEF[type].cost * (1 + 0.02 * towers.length));
const uCost = t => Math.round(TDEF[t.type].cost * (t.lvl === 1 ? 0.8 : 1.4));

function placeTower(type, k) {
  const x = cX(k), z = cZ(k), y = CELL.top[k];
  const t = { type, lvl: 1, k, x, y, z, g: new THREE.Group(), mesh: null, cd: 0.3, ang: 0, kills: 0, target: null, pop: 0.4 };
  t.g.position.set(x, y, z);
  t.mesh = voxMesh(towerGeo(type, 1));
  t.g.add(t.mesh);
  scene.add(t.g);
  CELL.occ[k] = 2;
  towers.push(t);
  ring(x, y + 0.1, z, 0xfff0b0, 2.2, 0.5);
  return t;
}
function upgradeTower(t) {
  gold -= uCost(t);
  t.lvl++;
  t.g.remove(t.mesh);
  t.mesh = voxMesh(towerGeo(t.type, t.lvl));
  t.g.add(t.mesh);
  t.pop = 0.4;
  ring(t.x, t.y + 0.1, t.z, 0xffd24a, 3.2, 0.6);
  burst(t.x, t.y + TDEF[t.type].topY, t.z, 16, [0xffd24a, 0xffffff], 4, 0.9, 0.3, 0.1, -4);
}
function tStat(t) {
  const d = TDEF[t.type], L = t.lvl - 1;
  return {
    dmg: d.dmg * (1 + 0.45 * L),
    rate: d.rate * (1 + 0.2 * L),
    range: d.range + 0.6 * L,
    slowT: (d.slowT || 0) + 0.4 * L,
    chain: (d.chain || 0) + (t.lvl >= 3 ? 1 : 0),
    splash: (d.splash || 0) * (1 + 0.2 * L),
  };
}
function findTarget(t, st) {
  let best = null, bp = -1;
  const r2 = st.range * st.range, air = TDEF[t.type].air;
  for (const e of enemies) {
    if (e.dead || (e.air && !air)) continue;
    const dx = e.x - t.x, dz = e.z - t.z;
    if (dx * dx + dz * dz > r2) continue;
    if (e.prog > bp) { bp = e.prog; best = e; }
  }
  return best;
}
function updateTowers(dt) {
  for (const t of towers) {
    if (t.pop > 0) { t.pop -= dt; t.g.scale.setScalar(1 + 0.3 * Math.sin(clamp(t.pop / 0.4, 0, 1) * Math.PI)); }
    const st = tStat(t);
    t.cd -= dt;
    const tg = findTarget(t, st);
    t.target = tg;
    if (!tg) continue;
    const want = Math.atan2(tg.x - t.x, tg.z - t.z);
    t.ang += shortAng(t.ang, want) * Math.min(1, dt * 9);
    t.g.rotation.y = t.ang;
    if (t.type === 'flame') flameTick(t, st, tg, dt);
    else if (t.cd <= 0) { t.cd = 1 / st.rate; fireAt(t, st, tg); }
  }
}
function fireAt(t, st, e) {
  const d = TDEF[t.type], ox = t.x, oy = t.y + d.topY, oz = t.z;
  if (t.type === 'arrow') spawnProj({ kind: 'arrow', x: ox, y: oy, z: oz, to: e, speed: 26, dmg: st.dmg });
  else if (t.type === 'frost') spawnProj({ kind: 'frost', x: ox, y: oy, z: oz, to: e, speed: 17, dmg: st.dmg, slowF: d.slowF, slowT: st.slowT });
  else if (t.type === 'cannon') spawnArc(ox, oy, oz, e, st);
  else if (t.type === 'storm') stormStrike(t, st, e);
}
function flameTick(t, st, tg, dt) {
  const yaw = Math.atan2(tg.x - t.x, tg.z - t.z), dx = Math.sin(yaw), dz = Math.cos(yaw);
  for (const e of enemies) {
    if (e.dead || e.air) continue;
    const ex = e.x - t.x, ez = e.z - t.z, dd = Math.hypot(ex, ez);
    if (dd > st.range + 0.5 || dd < 0.01) continue;
    if ((ex * dx + ez * dz) / dd > 0.6) {
      damageEnemy(e, st.dmg * dt);
      e.burn = Math.max(e.burn, 1.5);
      e.burnDps = Math.max(e.burnDps, st.dmg * 0.25);
    }
  }
  for (let i = 0; i < 3; i++) {
    const a = yaw + rr(-0.35, 0.35), sp = rr(4, 7);
    emit(t.x + dx * 0.6, t.y + TDEF.flame.topY, t.z + dz * 0.6, Math.sin(a) * sp * 0.7, rr(1, 3), Math.cos(a) * sp * 0.7,
      rr(0.35, 0.6), rr(0.3, 0.45), 0.08, 0xfff09a, 0xff4a1a, -1.5, 2.2);
  }
}

/* ================= projectiles ================= */
const PGEO = { arrow: new THREE.BoxGeometry(0.1, 0.1, 1.0), orb: new THREE.SphereGeometry(0.22, 10, 8), ball: new THREE.SphereGeometry(0.3, 12, 10) };
const PMAT = { arrow: new THREE.MeshLambertMaterial({ color: 0x7a5530 }), frost: new THREE.MeshBasicMaterial({ color: 0xa8f4ff }), ball: new THREE.MeshLambertMaterial({ color: 0x202225 }) };
const projs = [], arcs = [];

function spawnProj(o) {
  const m = new THREE.Mesh(o.kind === 'arrow' ? PGEO.arrow : PGEO.orb, o.kind === 'arrow' ? PMAT.arrow : PMAT.frost);
  m.position.set(o.x, o.y, o.z);
  scene.add(m);
  projs.push({ ...o, m, life: 0, dead: false, tx: o.to.x, ty: o.to.y + o.to.def.hpY * 0.5, tz: o.to.z });
}
function hitProj(p) {
  const tg = p.to, mp = p.m.position;
  damageEnemy(tg, p.dmg);
  if (p.kind === 'arrow') {
    sparks(tg.x, tg.y + tg.def.hpY * 0.5, tg.z, 0xc9a06a, 5, 4);
  } else {
    tg.slowF = tg.slow > 0 ? Math.min(tg.slowF, p.slowF) : p.slowF;
    tg.slow = Math.max(tg.slow, p.slowT);
    orb(mp.x, mp.y, mp.z, 0x9ff0ff, 1.3, 0.35);
    burst(mp.x, mp.y, mp.z, 10, [0xe6fbff, 0x7fe6ff], 4, 0.6, 0.25, 0.08, -6, 0.5, true);
  }
}
function updateProjs(dt) {
  for (const p of projs) {
    if (p.dead) continue;
    p.life += dt;
    const tg = p.to, mp = p.m.position;
    if (!tg.dead) { p.tx = tg.x; p.ty = tg.y + tg.def.hpY * 0.5; p.tz = tg.z; }
    const dx = p.tx - mp.x, dy = p.ty - mp.y, dz = p.tz - mp.z;
    const dist = Math.hypot(dx, dy, dz), step = p.speed * dt;
    if (dist <= step + 0.3 || p.life > 4) {
      p.dead = true;
      if (dist <= step + 0.3 && !tg.dead) hitProj(p);
      else sparks(mp.x, mp.y, mp.z, 0xdddddd, 4, 3);
      continue;
    }
    mp.x += dx / dist * step; mp.y += dy / dist * step; mp.z += dz / dist * step;
    p.m.lookAt(p.tx, p.ty, p.tz);
    if (p.kind === 'frost' && rnd() < 0.9) emit(mp.x, mp.y, mp.z, rr(-.4, .4), rr(-.4, .4), rr(-.4, .4), 0.35, 0.22, 0.05, 0xbfeeff, 0x4fb8e8, 0, 1.5);
  }
  for (let i = projs.length - 1; i >= 0; i--) if (projs[i].dead) { scene.remove(projs[i].m); projs.splice(i, 1); }
}

/* cannon shells: ballistic arc with a little target lead, splash on landing */
function spawnArc(x, y, z, e, st) {
  const sf = e.slow > 0 ? e.slowF : 1;
  const dist0 = Math.hypot(e.x - x, e.z - z);
  const T = clamp(dist0 / 17, 0.45, 2.2);
  const L = Math.hypot(e.hx, e.hz) || 1;
  const lead = e.def.spd * sf * T;
  const tx = e.x + e.hx / L * lead, tz = e.z + e.hz / L * lead;
  const m = new THREE.Mesh(PGEO.ball, PMAT.ball);
  m.position.set(x, y, z);
  scene.add(m);
  arcs.push({ m, sx: x, sy: y, sz: z, tx, ty: 1, tz, t: 0, T, H: 2.5 + dist0 * 0.22, dmg: st.dmg, splash: st.splash });
  burst(x, y, z, 10, [0xdadde3, 0x9aa0aa, 0xffa040], 3, 0.9, 0.35, 1.2, 1.5, 0.8);
}
function updateArcs(dt) {
  for (let i = arcs.length - 1; i >= 0; i--) {
    const a = arcs[i];
    a.t += dt;
    const s = Math.min(1, a.t / a.T), mp = a.m.position;
    mp.set(lerp(a.sx, a.tx, s), lerp(a.sy, a.ty, s) + Math.sin(Math.PI * s) * a.H, lerp(a.sz, a.tz, s));
    if (rnd() < 0.8) smoke(mp.x, mp.y, mp.z, 0.22);
    if (s >= 1) { cannonBoom(a); scene.remove(a.m); arcs.splice(i, 1); }
  }
}
function cannonBoom(a) {
  const x = a.tx, z = a.tz, r = a.splash;
  for (const e of enemies) {
    if (e.dead || e.air) continue;
    const dd = Math.hypot(e.x - x, e.z - z);
    if (dd <= r) damageEnemy(e, a.dmg * (1 - 0.5 * dd / r));
  }
  orb(x, 1.2, z, 0xffb040, r * 1.4, 0.45);
  ring(x, 1.02, z, 0xffe0a0, r * 1.6, 0.55);
  burst(x, 1.2, z, 26, [0xffd060, 0xff7a2a, 0xff3a1a], 9, 0.7, 0.8, 0.3, -6, 1.0);
  burst(x, 1.5, z, 14, [0x4f4a55, 0x8a8590], 3, 1.8, 1.2, 2.6, 0.6, 0.6);
  burst(x, 1.2, z, 12, [0x6a4a2a, 0x9b8a6a], 7, 1.0, 0.25, 0.12, -22, 0.1, true);
}

/* storm: instant chain lightning */
function stormStrike(t, st, e) {
  const from = V3(t.x, t.y + TDEF.storm.topY, t.z);
  const pos = en => V3(en.x, en.y + en.def.hpY * 0.5, en.z);
  const hit = [e];
  let cur = e;
  bolt(from, pos(e), 0xfff7b0);
  bolt(from, pos(e), 0x9fd8ff, 0.16);
  damageEnemy(e, st.dmg);
  sparks(e.x, e.y + 1, e.z, 0xfff48a, 10, 6);
  for (let c = 1; c < st.chain; c++) {
    let nx = null, bd = 3.8 * 3.8;
    for (const o of enemies) {
      if (o.dead || hit.includes(o)) continue;
      const dx = o.x - cur.x, dz = o.z - cur.z, dd = dx * dx + dz * dz;
      if (dd < bd) { bd = dd; nx = o; }
    }
    if (!nx) break;
    hit.push(nx);
    bolt(pos(cur), pos(nx), 0x9fd8ff);
    damageEnemy(nx, st.dmg * 0.75);
    sparks(nx.x, nx.y + 1, nx.z, 0x9fd8ff, 8, 5);
    cur = nx;
  }
}

/* ================= waves, castle, builder AI, game flow ================= */
const WAVES = 12;
const CASTLE_MAX = 100;
const INCOME = 2.4;
let wave = 0, waveCD = 0, spawnQ = [], spawnClock = 0, hpMul = 1;
let state = 'play', endT = 0, castleHp = CASTLE_MAX;
let gold = 150, castleShake = 0, needReset = false, episode = 0, simTime = 0, aiCD = 0;

function composeWave(w) {
  const L = [];
  const add = (k, n, span) => { for (let i = 0; i < n; i++) L.push({ k, t: rr(0, span) }); };
  add('imp', 3 + Math.round(w * 1.3), 9);
  add('orc', 1 + Math.round(w * 0.9), 10);
  if (w >= 3) add('troll', Math.floor((w - 1) / 2), 12);
  if (w >= 2) add('bat', 1 + Math.floor(w / 2), 10);
  if (w % 5 === 0 || w === WAVES) add('golem', 1, 2);
  L.sort((a, b) => a.t - b.t);
  return L;
}
function startWave() {
  wave++;
  spawnQ = composeWave(wave);
  spawnClock = 0;
  hpMul = 1 + 0.2 * (wave - 1);
  waveCD = wave < WAVES ? 20 : 1e9;
}
function waveUpdate(dt) {
  if (state !== 'play') return;
  if (spawnQ.length) {
    spawnClock += dt;
    while (spawnQ.length && spawnQ[0].t <= spawnClock) {
      const q = spawnQ.shift();
      spawnEnemy(q.k, hpMul);
    }
  }
  if (wave < WAVES) {
    waveCD -= dt;
    if (waveCD <= 0) startWave();
  }
}

function castleHit(dmg) {
  if (state !== 'play') return;
  castleHp = Math.max(0, castleHp - dmg);
  castleShake = 0.7;
  for (let i = 0; i < 10; i++) smoke(CAST.x + rr(-2.5, 2.5), 6 + rr(0, 4), CAST.z + rr(-3, 3), 0.7);
  burst(CAST.x - 3, 2.5, CAST.z + rr(-2, 2), 16, [0x8f949c, 0xc8ccd4, 0xffa040], 6, 0.9, 0.35, 0.15, -20, 0.1, true);
  if (castleHp <= 0) { state = 'defeat'; endT = 0; }
}

/* ---- builder AI: picks spots that cover the most of the path, mixes tower types, upgrades the busiest ---- */
function bestSpot(type) {
  const range = TDEF[type].range;
  let best = -1, bs = -1e9;
  for (let k = 0; k < NC; k++) {
    if (CELL.type[k] !== 0 || CELL.occ[k]) continue;
    const dp = CELL.dp[k];
    if (dp < 1.6 || dp > range + 0.5) continue;
    const x = cX(k), z = cZ(k), r2 = range * range;
    let cov = 0;
    for (let s = 0; s < PATH_N; s += 5) {
      const p = PATH[s], dx = p.x - x, dz = p.z - z;
      if (dx * dx + dz * dz <= r2) cov++;
    }
    if (cov < 4) continue;
    let crowd = 0;
    for (const t of towers) { const dx = t.x - x, dz = t.z - z; if (dx * dx + dz * dz < 4.5) crowd++; }
    const score = cov - crowd * 6 + (type === 'cannon' && dp > 5 ? 3 : 0);
    if (score > bs) { bs = score; best = k; }
  }
  return best;
}
function aiUpdate(dt) {
  aiCD -= dt;
  if (aiCD > 0 || state !== 'play') return;
  aiCD = 0.5;
  const total = towers.length;
  const counts = { arrow: 0, cannon: 0, frost: 0, storm: 0, flame: 0 };
  for (const t of towers) counts[t.type]++;

  const ups = towers.filter(t => t.lvl < 3).sort((a, b) => (b.kills - a.kills) || (a.lvl - b.lvl));
  if (ups.length && total >= 5 && rnd() < 0.45 && gold >= uCost(ups[0])) { upgradeTower(ups[0]); return; }

  // choose the most-needed tower type, then save up for it rather than spending on something cheaper
  const ratio = { arrow: 0.26, cannon: 0.2, frost: 0.17, storm: 0.2, flame: 0.17 };
  let bt = null, bs = -1e9;
  for (const k in ratio) {
    const s = ratio[k] * (total + 1) - counts[k] + rr(-0.3, 0.3);
    if (s > bs) { bs = s; bt = k; }
  }
  if (!bt || gold < buildCost(bt)) return;
  const k = bestSpot(bt);
  if (k < 0) return;
  gold -= buildCost(bt);
  placeTower(bt, k);
}

/* ---- sim ---- */
function simStep(dt) {
  simTime += dt;
  waveUpdate(dt);
  updateEnemies(dt);
  updateTowers(dt);
  updateProjs(dt);
  updateArcs(dt);
  updateCoins(dt);
  aiUpdate(dt);
  if (state === 'play') gold += INCOME * dt;
  castleShake = Math.max(0, castleShake - dt);
  if (state === 'play' && wave >= WAVES && spawnQ.length === 0 && enemies.length === 0) { state = 'victory'; endT = 0; }
  if (state !== 'play') { endT += dt; if (endT > 9) needReset = true; }
}

function fastForward(sec) {
  FF = true;
  const dt = 1 / 30, n = Math.round(sec / dt);
  for (let i = 0; i < n; i++) simStep(dt);
  FF = false;
}

function resetWorld() {
  for (const t of towers) scene.remove(t.g);
  towers.length = 0;
  for (const e of enemies) releaseEnemy(e);
  enemies.length = 0;
  for (const p of projs) scene.remove(p.m);
  projs.length = 0;
  for (const a of arcs) scene.remove(a.m);
  arcs.length = 0;
  for (const c of COINS) scene.remove(c.m);
  COINS.length = 0;
  for (const f of FX) { scene.remove(f.m); if (f.kind === 'bolt') f.m.geometry.dispose(); f.m.material.dispose(); }
  FX.length = 0;
  episode++;
  RS = 1000 + episode * 7919;          // a new map every battle
  kills = 0; gold = 150; castleHp = CASTLE_MAX;
  wave = 0; waveCD = 0; spawnQ = []; state = 'play'; endT = 0; aiCD = 0;
  buildMap();
  startWave();
  fastForward(55);                      // the new battle is already under way on the first frame
}

/* ================= camera: cutting shots ================= */
let camFit = 1, shotType = -1, shotT = 0, shotDur = 6, shotAng = 0, focusE = null, snapCam = true;
const camT = { p: V3(0, 40, 60), l: V3(0, 0, 0) };   // where the current shot wants to be
const cam = { p: V3(70, 40, 60), l: V3(0, 0, 0) };   // what the camera actually is
const _f = V3(), _f2 = V3();

function focusVec(f, out) {
  if (f.def) out.set(f.x, f.y + f.def.h * 0.5, f.z);
  else out.set(f.x, f.y + 2.5, f.z);
  return out;
}
function pickFocus() {
  const live = enemies.filter(e => !e.dead);
  if (live.length && rnd() < 0.7) {
    const ground = live.filter(e => !e.air);
    return (ground.length && rnd() < 0.8) ? pick(ground) : pick(live);
  }
  const tw = towers.filter(t => t.target);
  return tw.length ? pick(tw) : null;
}
function startShot() {
  let t;
  do { t = ri(0, 4); } while (t === shotType && rnd() < 0.85);
  focusE = null;
  if (t === 1) focusE = pickFocus();
  if (t === 2) { const g = enemies.filter(e => !e.dead && !e.air); focusE = g.length ? pick(g) : null; }
  if ((t === 1 || t === 2) && !focusE) t = 0;
  shotType = t;
  shotT = 0;
  shotAng = rr(0, TAU);
  shotDur = [8, 5.5, 6, 5, 6.5][t];
  snapCam = true;
}
function aimCamera(dt) {
  const u = clamp(shotT / shotDur, 0, 1), eu = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  const P = camT.p, L = camT.l;
  switch (shotType) {
    case 0: { // slow orbit of the whole map
      const a = shotAng + shotT * 0.12, R = 64 * camFit, h = (34 + 5 * Math.sin(shotT * 0.5)) * camFit;
      P.set(Math.cos(a) * R, h, Math.sin(a) * R);
      L.set(Math.sin(shotT * 0.2) * 3, 0.5, 0);
      break;
    }
    case 1: { // swoop down onto the thick of the fight
      focusVec(focusE, _f);
      const a = shotAng, r = lerp(30, 9, eu), h = lerp(24, 6, eu);
      P.set(_f.x + Math.cos(a) * r, _f.y + h, _f.z + Math.sin(a) * r);
      L.copy(_f);
      break;
    }
    case 2: { // chase: low and behind an advancing enemy
      const e = focusE, n = Math.hypot(e.hx, e.hz) || 1, ux = e.hx / n, uz = e.hz / n;
      P.set(e.x - ux * 9, e.y + 4.5, e.z - uz * 9);
      L.set(e.x + ux * 4, e.y + 1.4, e.z + uz * 4);
      break;
    }
    case 3: { // high drifting overview
      const a = shotAng + shotT * 0.07, R = 36 * camFit;
      P.set(Math.cos(a) * R, 62 * camFit, Math.sin(a) * R + 4 * camFit);
      L.set(0, 0, 0);
      break;
    }
    case 4: { // low sweep along the path, behind the army
      const d = PATH_LEN * lerp(0.08, 0.85, eu);
      pathAt(d - 5, _f); pathAt(d + 7, _f2);
      P.set(_f.x, 4.6, _f.z - 4.5);
      L.set(_f2.x, 1.4, _f2.z);
      break;
    }
  }
  const k = snapCam ? 1 : 1 - Math.exp(-dt * 6);
  snapCam = false;
  cam.p.lerp(P, k);
  cam.l.lerp(L, k);
  camera.position.copy(cam.p);
  camera.lookAt(cam.l);
}

/* ================= day -> dusk sky, lights, sun and moon ================= */
const C_DAY = new THREE.Color(0xfff2dc), C_DUSK = new THREE.Color(0xff9a5c), C_MOON = new THREE.Color(0x7f9cff);
const SKY_DAY = new THREE.Color(0x7ec4f2), SKY_NIGHT = new THREE.Color(0x0a1030), SKY_DUSK = new THREE.Color(0xf08a5c);
const _sun = new THREE.Vector3();
function updateSky() {
  const ph = (simTime / 240 + 0.2) % 1, a = ph * TAU;
  _sun.set(Math.cos(a), Math.sin(a), 0.32).normalize();
  const h = _sun.y;
  const day = sstep(-0.1, 0.22, h), dusk = Math.exp(-(h * h) / 0.035);
  scene.background.copy(SKY_NIGHT).lerp(SKY_DAY, day).lerp(SKY_DUSK, dusk * 0.85);
  scene.fog.color.copy(scene.background);
  sun.position.copy(_sun).multiplyScalar(90);
  sun.intensity = lerp(0.22, 1.6, day) + dusk * 0.5;
  sun.color.copy(C_MOON).lerp(C_DAY, day).lerp(C_DUSK, dusk * 0.8);
  hemi.intensity = lerp(0.5, 0.95, day);
  sunDisc.position.copy(_sun).multiplyScalar(330);
  sunDisc.visible = h > -0.08;
  moonDisc.position.copy(_sun).multiplyScalar(-330);
  moonDisc.visible = h < 0.08;
  stars.material.opacity = clamp((0.3 - h) * 2, 0, 1) * 0.9;
  campLight.intensity = (1 - day) * 6 * (0.85 + 0.15 * Math.sin(simTime * 13.1) * Math.sin(simTime * 7.3));
  matCloud.color.setRGB(1, 1, 1).lerp(C_DUSK, dusk * 0.6);
  return day;
}

/* ================= ambient emitters: smoke, sparks, confetti ================= */
function ambient(dt) {
  if (rnd() < dt * 14) smoke(CAMPFIRE.x, CAMPFIRE.y + 0.4, CAMPFIRE.z, 0.35);
  if (rnd() < dt * 22) fireBit(CAMPFIRE.x, CAMPFIRE.y + 0.2, CAMPFIRE.z);
  if (WATERK.length && rnd() < dt * 6) {
    const k = WATERK[ri(0, WATERK.length - 1)];
    emit(cX(k), 0.8, cZ(k), rr(-.3, .3), rr(1, 2), rr(-.3, .3), 0.8, 0.12, 0.04, 0xffffff, 0x9fdcff, -2);
  }
  if (castleHp < 55 && rnd() < dt * 5) smoke(CAST.x + rr(-2, 2), 9 + rr(0, 2), CAST.z + rr(-2, 2), 0.6);
  if (state === 'victory' && rnd() < dt * 25) {
    emit(CAST.x + rr(-3, 3), 12, CAST.z + rr(-3, 3), rr(-2, 2), rr(4, 9), rr(-2, 2), 2.2, 0.25, 0.2, pick([0xffd24a, 0xff5a5a, 0x7fe6ff]), 0xffffff, -9, 0.1);
  }
  if (state === 'defeat' && rnd() < dt * 8) smoke(CAST.x + rr(-2, 2), 4 + rr(0, 5), CAST.z + rr(-2, 2), 0.9);
}
function updateCastleAnim() {
  if (!CASTLE_G) return;
  const base = CELL.top[cIdx(CAST.x, CAST.z)];
  const sx = castleShake > 0 ? Math.sin(simTime * 70) * castleShake * 0.25 : 0;
  if (state === 'defeat') {
    const k = Math.min(1, endT / 4);
    CASTLE_G.position.y = base - k * 5;
    CASTLE_G.rotation.z = k * 0.22;
    CASTLE_G.rotation.x = k * 0.1;
  }
  CASTLE_G.position.x = CAST.x + sx;
}

/* ================= HUD (top-left only) ================= */
const $ = id => document.getElementById(id);
let hudT = 0;
function updateHud(dt) {
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.2;
  $('wv').textContent = wave;
  $('wt').textContent = WAVES;
  $('gd').textContent = Math.floor(gold);
  $('cv').textContent = `${Math.ceil(castleHp)}/${CASTLE_MAX}`;
  $('hfill').style.width = (castleHp / CASTLE_MAX * 100).toFixed(1) + '%';
  $('kl').textContent = kills;
  $('status').textContent = state === 'victory' ? 'Victory - the keep stands'
    : state === 'defeat' ? 'The keep has fallen - rebuilding'
    : wave >= WAVES ? 'Final wave - hold the keep'
    : wave % 5 === 0 ? 'Boss wave underway'
    : 'Wave underway';
}

/* ================= main loop ================= */
function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const fovR = camera.fov * Math.PI / 180;
  camFit = Math.max(1, 34 / (58 * Math.tan(fovR / 2) * camera.aspect));  // keep the whole map in frame
  scene.fog.near = 90 * camFit;
  scene.fog.far = 230 * camFit;
}
addEventListener('resize', onResize);

let lastNow = performance.now(), needInit = true;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  if (needReset) { needReset = false; resetWorld(); }
  simStep(dt);
  updateParticles(dt);
  updateFx(dt);
  updateBars();
  updateSky();
  updateClouds(dt);
  ambient(dt);
  updateCastleAnim();
  shotT += dt;
  if (shotT >= shotDur) startShot();
  aimCamera(dt);
  updateHud(dt);
  renderer.render(scene, camera);
}

/* ================= boot: a battle already under way ================= */
initScenery();
buildMap();
startWave();
fastForward(55);
onResize();
startShot();
aimCamera(0);
requestAnimationFrame(frame);
</script>
